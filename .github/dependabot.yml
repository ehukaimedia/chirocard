version: 2
updates:
  # Dependabot stays enabled (free with GitHub). npm version-bump PRs are
  # maintainer-batched: majors and Capacitor native packages need a human, and
  # grouped auto-PRs kept failing CI. Security alerts still fire on GitHub.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor/android"
      - dependency-name: "@capacitor/ios"
      - dependency-name: "@capacitor/core"
      - dependency-name: "@capacitor/cli"
      - dependency-name: "@capacitor-community/sqlite"
  # Pin GitHub Actions to current SHAs. These PRs have been small and green.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
