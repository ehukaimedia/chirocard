version: 2
updates:
  # npm dependencies. Dependabot opens PRs the maintainer reviews; the 7-day
  # quarantine (CONTRIBUTING.md) is applied at review time, and CI must pass.
  # Group only patch/minor bumps. Majors (ESLint 10, TypeScript 7, Tailwind 4,
  # Vite 8) must stay ungrouped so they cannot land as one failing PR.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@capacitor-community/sqlite"
        update-types: ["version-update:semver-major"]
  # Keep GitHub Actions pinned-SHAs current (security updates).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
